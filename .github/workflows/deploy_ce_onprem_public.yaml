name: Release Verification

on:
  workflow_call:
    inputs:
      version:
        description: 'MLRun CE Chart version (e.g. 0.9.2)'
        required: true
        type: string
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
      DEPLOYMENT_REPO:
        required: true
      DEPLOYMENT_WORKFLOW_FILE:
        required: true
      DEPLOYMENT_EVENT_TYPE:
        required: true

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Resolve target
        id: target
        env:
          TARGET_REPO: ${{ secrets.DEPLOYMENT_REPO }}
          TARGET_WORKFLOW_FILE: ${{ secrets.DEPLOYMENT_WORKFLOW_FILE }}
          TARGET_EVENT_TYPE: ${{ secrets.DEPLOYMENT_EVENT_TYPE }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_REPO" != */* ]]; then
            echo "::error::DEPLOYMENT_REPO must be in the form owner/repo."
            exit 1
          fi

          if [[ ! "$TARGET_WORKFLOW_FILE" =~ ^[A-Za-z0-9_.-]+\.ya?ml$ ]]; then
            echo "::error::DEPLOYMENT_WORKFLOW_FILE must be a workflow file name."
            exit 1
          fi

          if [[ ! "$TARGET_EVENT_TYPE" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::DEPLOYMENT_EVENT_TYPE must be a repository_dispatch event type."
            exit 1
          fi

          printf '%s\n' "::add-mask::$TARGET_REPO"
          printf '%s\n' "::add-mask::${TARGET_REPO%%/*}"
          printf '%s\n' "::add-mask::${TARGET_REPO#*/}"
          printf '%s\n' "::add-mask::$TARGET_WORKFLOW_FILE"
          printf '%s\n' "::add-mask::$TARGET_EVENT_TYPE"
          {
            printf 'repo=%s\n' "$TARGET_REPO"
            printf 'workflow_file=%s\n' "$TARGET_WORKFLOW_FILE"
            printf 'event_type=%s\n' "$TARGET_EVENT_TYPE"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout verification action
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github/actions/release-verification
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release
        uses: ./.github/actions/release-verification
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          target-repo: ${{ steps.target.outputs.repo }}
          target-workflow-file: ${{ steps.target.outputs.workflow_file }}
          target-event-type: ${{ steps.target.outputs.event_type }}
          version: ${{ inputs.version }}
          source-repo: ${{ github.repository }}
          source-sha: ${{ github.sha }}
          source-run-id: ${{ github.run_id }}
          source-run-attempt: ${{ github.run_attempt }}
          triggered-by: ${{ github.actor }}
