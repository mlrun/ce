name: CI

on:
  pull_request:
    branches:
      - development
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          check-latest: true
      - name: Set up chart-testing
        id: chart-testing-setup
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f #v2.8.0
        with:
          version: v3.10.1
        continue-on-error: true
      - name: Clean partial chart-testing cache
        # ct.sh creates the cache dir before verifying the download's
        # signature, so a failed cosign/Rekor check (transient upstream
        # flake) leaves a stale empty dir that would make a bare retry
        # skip reinstalling and fail differently. Clear it before retrying.
        if: steps.chart-testing-setup.outcome == 'failure'
        run: rm -rf "${RUNNER_TOOL_CACHE}/ct"
      - name: Retry chart-testing setup
        if: steps.chart-testing-setup.outcome == 'failure'
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f #v2.8.0
        with:
          version: v3.10.1
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run chart-testing (lint)
        run: make helm-lint
        if: steps.list-changed.outputs.changed == 'true'
        env:
          HELM_LINT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  artifacthub-lint:
    runs-on: ubuntu-latest
    container:
      image: artifacthub/ah
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ah lint
        working-directory: ./charts/mlrun-ce
        run: ah lint
