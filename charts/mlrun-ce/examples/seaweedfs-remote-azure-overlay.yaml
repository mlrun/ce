# Copy pipeline output files to your Azure storage container.
# Fill in the Azure settings below (replace every <...> value).
# seaweedfs.remote.bucket must use the same name as containerName.
# emptyDir is for quick tests only — files on the cluster may be lost on restart; Azure keeps the copy.
storage:
  azure:
    accountName: <ACCOUNT_NAME>
    accountKey: <ACCOUNT_KEY>
    containerName: <CONTAINER_NAME>

seaweedfs:
  allInOne:
    data:
      type: emptyDir
  remote:
    enabled: true
    provider: azure
    bucket: <CONTAINER_NAME>

# Optional: uncomment to save MLRun projects in the same Azure container (add mode: azure-blob):
# storage:
#   mode: azure-blob
#   azure:
#     accountName: <ACCOUNT_NAME>
#     accountKey: <ACCOUNT_KEY>
#     containerName: <CONTAINER_NAME>
