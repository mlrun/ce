# Copy this file and fill in your Azure details below.
#
# What it does:
# - Saves Kubeflow pipeline files from the cluster to Azure Blob Storage (container "kfp-artifacts" by default).
# - MLRun project files stay on the cluster unless you also turn on "azure-blob" mode (see bottom of file).
#
# Before you install: in the Azure portal, create two containers in your storage account if you use both features:
#   "kfp-artifacts" (pipelines) and "mlrun" (optional, for MLRun in Azure).
#
# For quick tests only: cluster storage may be cleared when pods restart; Azure keeps your pipeline copies.
storage:
# Optional — Also store MLRun projects in Azure 
# storage:
#   mode: azure-blob
  azure:
    accountName: <ACCOUNT_NAME>
    accountKey: <ACCOUNT_KEY>
    connectionString: ""
    containerName: mlrun

seaweedfs:
  allInOne:
    data:
      type: emptyDir
  remote:
    enabled: true
    provider: azure
    bucket: kfp-artifacts


