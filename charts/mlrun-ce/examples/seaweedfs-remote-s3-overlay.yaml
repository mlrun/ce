# Copy this file, replace the placeholders below, and use it with your main install settings.
#
# What this does:
# - Saves your MLRun projects and pipeline run files to AWS S3 (one bucket you choose).
# - Pipeline files are copied from the SeaweedFS cluster to S3 automatically in the background.
#
# Before you install:
# 1. In AWS, create an S3 bucket and an access key that can read and write it.
# 2. Fill in access key, secret key, bucket name, and region below.

storage:
  mode: s3
  s3:
    accessKey: <ACCESS_KEY>
    secretKey: <SECRET_KEY>
    bucket: <YOUR_S3_BUCKET_NAME>

seaweedfs:
  allInOne:
    data:
      type: emptyDir
  remote:
    enabled: true
    provider: s3
    s3:
      endpoint: s3.<REGION>.amazonaws.com
      region: <REGION> # e.g. us-east-2
