# KFP pipeline artifacts: in-cluster SeaweedFS (emptyDir) + background sync to AWS S3.
#
# storage.s3.* feeds seaweedfs.remote. storage.mode controls MLRun/Jupyter only
# (defaults to local). Set storage.mode: s3 to store MLRun/Jupyter artifacts in S3 too.
#
# emptyDir (lab/dev): no SeaweedFS PVC — local tier is ephemeral pod disk. Cloud is the durable
# copy after sync. Not recommended for production (pod restart wipes local state; run helm upgrade
# to re-run remote.configure/remote.mount if the gateway stalls after restart).

storage:
  s3:
    bucket: <BUCKET_NAME>
    accessKey: <ACCESS_KEY>
    secretKey: <SECRET_KEY>

seaweedfs:
  allInOne:
    data:
      type: emptyDir
  remote:
    enabled: true
    provider: s3
    bucket: <BUCKET_NAME>
    s3:
      endpoint: s3.<REGION>.amazonaws.com
      region: <REGION> # e.g. us-east-2
