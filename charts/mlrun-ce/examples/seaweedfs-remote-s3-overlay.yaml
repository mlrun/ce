# Example overlay: persist KFP pipeline artifacts to AWS S3 via SeaweedFS remote gateway.
#
# Pass AWS IAM keys at deploy time — do not commit secrets:
#
#   helm upgrade --install mlrun-ce charts/mlrun-ce -n mlrun \
#     -f <your-environment-values>.yaml \
#     -f charts/mlrun-ce/examples/seaweedfs-remote-s3-overlay.yaml \
#     --set storage.s3.accessKey="$AWS_ACCESS_KEY_ID" \
#     --set storage.s3.secretKey="$AWS_SECRET_ACCESS_KEY"
#
# See: https://www.kubeflow.org/docs/components/pipelines/operator-guides/configure-object-store/

storage:
  mode: local
  s3:
    bucket: <BUCKET_NAME>
    accessKey: <ACCESS_KEY>
    secretKey: <SECRET_KEY>

seaweedfs:
  remote:
    enabled: true
    name: cloudstorage
    provider: s3
    bucket: <BUCKET_NAME>
    s3:
      endpoint: s3.<REGION>.amazonaws.com
      region: <REGION> # e.g. us-east-2
      forcePathStyle: false
    mount:
      mountExisting: true

pipelines:
  storage:
    mode: local
  images:
    mysql:
      tag: "8.4"
