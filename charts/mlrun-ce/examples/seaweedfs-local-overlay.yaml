# Example overlay: KFP pipeline artifacts on in-cluster SeaweedFS only (no cloud sync).
#
# This is the DEFAULT chart behaviour — you do not need this file for a fresh install.
# Use it when you want to be explicit, or to turn remote sync OFF after testing
# seaweedfs-remote-s3-overlay.yaml / seaweedfs-remote-azure-overlay.yaml.
#
#   helm upgrade --install mlrun charts/mlrun-ce -n mlrun \
#     -f <your-environment-values>.yaml \
#     -f charts/mlrun-ce/examples/seaweedfs-local-overlay.yaml
#
# Artifacts stay in the local SeaweedFS bucket (storage.local.bucket, default: mlrun).
# No remote gateway, config job, or cloud credentials required.

storage:
  mode: local

seaweedfs:
  remote:
    enabled: false

pipelines:
  storage:
    mode: local
