kube-prometheus-stack:
  fullnameOverride: monitoring
  enabled: true
  prometheusOperator:
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
  alertmanager:
    enabled: false
  grafana:
    adminUser: admin
    adminPassword: admin
    initChownData:
      enabled: false
    additionalDataSources:
      - name: iguazio
        type: mysql
        url: mlrun-db:3306
        user: root
        password:
        database: mlrun_model_monitoring
        editable: true
        maxOpenConns: 100
        maxIdleConns: 100
        maxIdleConnsAuto: true
    persistence:
      type: pvc
      enabled: true
      size: 10Gi
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Editor
    fullnameOverride: grafana
    enabled: true
    service:
      type: NodePort
      nodePort: 30010
    ingress:
      enabled: false
  prometheus:
    enabled: true
    service:
      type: NodePort
      nodePort: 30020
    prometheusSpec:
      # Enable OTLP write receiver so the OTel collector can push metrics directly
      # to Prometheus at /api/v1/otlp/v1/metrics instead of Prometheus scraping the collector.
      # Prometheus v3 requires both the feature flag AND --web.enable-otlp-receiver.
      #
      # NOTE: These flags are always set regardless of opentelemetry.collector.enabled.
      # There is no Helm-native way to conditionally configure sub-chart values.
      # The risk is minimal: the OTLP endpoint (/api/v1/otlp) shares port 9090 with the
      # Prometheus query API which is already unauthenticated in CE.
      enableFeatures:
        - otlp-write-receiver
      additionalArgs:
        - name: web.enable-otlp-receiver
          value: ""
  kube-state-metrics:
    fullnameOverride: state-metrics
  prometheus-node-exporter:
    fullnameOverride: node-exporter
    hostNetwork: false
    service:
      port: 9100
    hostRootFsMount:
      enabled: false

