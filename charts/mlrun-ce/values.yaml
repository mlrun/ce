    accessMode: "ReadWriteOnce"
    annotations:
      helm.sh/resource-policy: "keep"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
  nodeSelector: {}
  tolerations: []
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

strimzi-kafka-operator:
  enabled: true
  watchAnyNamespace: true
#  defaultImageRegistry: quay.io
#  defaultImageRepository: strimzi
#  defaultImageTag: 0.48.0

kafka:
  enabled: true
  name: kafka-stream

  # Bootstrap service alias configuration
  bootstrapAlias:
    # Create a service alias for simpler Kafka bootstrap server name
    # When enabled, creates: {name}.{namespace}.svc.cluster.local:9092
    # instead of the default: {name}-kafka-bootstrap.{namespace}.svc.cluster.local:9092
    enabled: true
    # Name for the bootstrap service alias (only used if enabled is true)
    name: kafka-stream

  replicas: 1

  listeners:
    - name: client
      port: 9092
      type: internal
      tls: false
    - name: controller
      port: 9093
      type: internal
      tls: false
    - name: internal
      port: 9094
      type: internal
      tls: false

  storage:
    type: persistent-claim
    size: 8Gi
    class: ""

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  config:
    # Replication settings for single-node setup
    default.replication.factor: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1

  zookeeper:
    replicas: 0

  # Kafka RBAC for user namespaces
  # Enable this when installing in user namespaces (mlrun, mlrun1, etc.)
  # When enabled, creates: ServiceAccount "kafka-client" + Role/RoleBinding
  rbac:
    # Enable RBAC for this namespace to access Kafka
    enabled: true

    # Operator namespace (where Kafka operator/cluster is running)
    # Empty means "use the release namespace"
    # Example: "controller" if that's where you installed the operator
    operatorNamespace: ""

  # NetworkPolicy for Kafka isolation in multi-NS deployments
  egress:
    enabled: false
# Spark configuration for multi-NS deployments
# Controls CE-level spark resources (mlrun-spark-config ConfigMap)
# In single-NS mode, both spark.enabled and spark-operator.enabled are true
# In multi-NS admin mode, spark.enabled is false (no ConfigMap needed)
# In multi-NS user mode, spark.enabled is true (ConfigMap needed for MLRun)
spark:
  enabled: true

# =============================================================================
# Shared OpenTelemetry producer-side configuration (CEML-708)
# Top-level so any service in the bundle (mlrun-api today; Nuclio and future
# components later) reads the same OTel knobs. Wired into mlrun-api via
# MLRUN_TELEMETRY__* env vars in templates/config/mlrun-env-configmap.yaml.
#
# Resolution at render time:
#   - enabled: "" inherits from .Values.opentelemetry.collector.enabled;
#     explicit "true"/"false" overrides. Safety: enabled="true" with no
#     in-cluster collector AND no user-supplied otlpEndpoint is forced to
#     "false" (no listener — exporting would silently drop).
#   - otlpEndpoint: "" derives otel-collector.<release-ns>.svc.cluster.local:<grpcPort>
#     from the in-cluster collector; user-supplied value wins (e.g. external SaaS).
#   - insecure: "" falls back to MLRun's own default (true, plaintext gRPC —
#     correct for the in-cluster collector). Set "false" when pointing
#     otlpEndpoint at a TLS-terminated endpoint (most SaaS providers).
#   - headersSecretName: "" falls back to MLRun's own default (no auth headers).
#     Only emitted as MLRUN_TELEMETRY__* env var when a value is supplied.
# =============================================================================
telemetry:
  enabled: ""
  otlpEndpoint: ""
  insecure: ""
  headersSecretName: ""

# =============================================================================
# OpenTelemetry Operator configuration
# Installs the OpenTelemetry Operator for managing collectors and instrumentation
# =============================================================================
opentelemetry-operator:
  enabled: false
  # CRDs are managed by the operator sub-chart (crds.create: true).
  # The otel-cr-installer job polls kubectl wait --for=condition=Established
  # on each CRD before applying CRs, so there is no race condition on fresh install.
  # CRDs are automatically kept in sync with the operator chart version on every upgrade.
  crds:
    create: true
  # Admission webhooks configuration
  admissionWebhooks:
    certManager:
      enabled: false
    autoGenerateCert:
      enabled: true
    # Only apply webhooks to namespaces with the opentelemetry label
    # This ensures the operator only monitors labeled namespaces
    namespaceSelector:
      matchLabels:
        opentelemetry.io/inject: "enabled"
  manager:
    # Collector image used by the operator when creating collectors
    collectorImage:
      repository: otel/opentelemetry-collector-contrib
      tag: 0.145.0
    # Auto-instrumentation images (all fields required by the sub-chart schema)
    autoInstrumentationImage:
      python:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python
        tag: 0.60b1
      java:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java
        tag: 2.10.0
      nodejs:
        repository: ""
        tag: ""
      dotnet:
        repository: ""
        tag: ""
      go:
        repository: ""
        tag: ""
      apacheHttpd:
        repository: ""
        tag: ""
    # Feature gates as string (comma-separated)
    featureGates: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# =============================================================================
# OpenTelemetry Collector and Instrumentation CRs
# These are managed separately from the operator for admin/non-admin split
# =============================================================================
opentelemetry:
  # Namespace label for enabling OpenTelemetry monitoring.
  # When enabled, the post-install job labels the namespace and also annotates it with
  # instrumentation.opentelemetry.io/inject-python so all Python pods are auto-instrumented.
  namespaceLabel:
    enabled: false
    key: "opentelemetry.io/inject"
    value: "enabled"

  # OpenTelemetry Collector configuration (DEPLOYMENT mode)
  # A single collector Deployment runs per namespace, receiving OTLP from instrumented pods
  # and exporting metrics to Prometheus.
  collector:
    enabled: false
    nameOverride: ""
    fullnameOverride: ""
    # DEPLOYMENT mode - one collector pod per namespace, not injected as a sidecar
    mode: deployment
    # "none" keeps the collector at the image version specified below, preventing the operator
    # from auto-upgrading it on operator upgrades (which can introduce breaking config changes).
    upgradeStrategy: none
    # Collector sidecar container resources
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # OTLP receiver port references — used by the Instrumentation CR endpoint and NOTES output.
    # If you change these, update the matching ports in collector.config.receivers.otlp as well.
    otlp:
      grpcPort: 4317
      httpPort: 4318
    # Full OpenTelemetry Collector pipeline configuration.
    # This is passed verbatim to the OpenTelemetryCollector CR spec.config field.
    # Override any section to customize receivers, processors, exporters, or pipelines.
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch:
          send_batch_size: 10000
          timeout: 10s
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 25
        resourcedetection:
          detectors:
            - env
            - system
          timeout: 5s
          override: false
      exporters:
        otlphttp/prometheus:
          # Short DNS works within the same namespace; no namespace interpolation needed.
          endpoint: http://prometheus-operated:9090/api/v1/otlp
          tls:
            insecure: true
        debug:
          verbosity: basic
          sampling_initial: 5
          sampling_thereafter: 200
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      service:
        extensions:
          - health_check
        pipelines:
          metrics:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - resourcedetection
              - batch
            exporters:
              - otlphttp/prometheus
              - debug
          traces:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - resourcedetection
              - batch
            exporters:
              - debug
        telemetry:
          logs:
            level: info

  # Instrumentation configuration for auto-instrumentation
  instrumentation:
    enabled: false
    nameOverride: ""
    # Fixed name so Nuclio functionDefaults.podAnnotations can reference it without Helm templating
    fullnameOverride: "mlrun-otel-instrumentation"
    # Propagators for distributed tracing context
    propagators:
      - tracecontext
      - baggage
    # Sampler configuration
    sampler:
      type: parentbased_traceidratio
      argument: "1"
    # Python auto-instrumentation
    python:
      enabled: true
      image:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python
        tag: 0.60b1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    # Java auto-instrumentation (disabled by default, enable if needed)
    java:
      enabled: false
      image:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java
        tag: 2.10.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi

  # kubectl image used by the otelCrInstaller and namespaceLabelJob
  kubectlImage:
    repository: bitnami/kubectl
    tag: "latest"

  # OTel CR installer job resources (kubectl-only container)
  otelCrInstaller:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # Namespace label job resources (kubectl-only container)
  namespaceLabelJob:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
