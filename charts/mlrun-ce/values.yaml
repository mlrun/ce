# We use global values scope to multiplex the docker-registry details to both mlrun and nuclio
global:
  # External host/ip to reach the k8s node. This might take various values if k8s is run in a VM or a cloud env
  externalHostAddress: localhost
  registry: &userRegistry
    url: mustprovide
    secretName:
  nuclio:
    dashboard:
      nodePort: 30050
  infrastructure:
    # Defines infra flavour, for instance: standalone, onprem, aws, azure, gcp...
    kind: standalone
    # Defines k8s flavour, for instance: eks, aks, gcp, kubespray, openshift, rancher, minikube...
    provider: ~
    inboundCidrs: ~
    loadBalancerName: ~
    aws:
      bucketName: ~
      s3NonAnonymous: false
      domainNameCertificate: ~

# =============================================================================
# S3-compatible storage configuration
# These credentials are used by MLRun, Jupyter, and Kubeflow Pipelines
# to access the S3-compatible storage backend (SeaweedFS)
# =============================================================================
s3:
  accessKey: "minio"
  secretKey: "minio123"
  bucket: "mlrun"

nuclio:
  global:
    registry: *userRegistry
  # coupled with mlrun.nuclio.dashboardName template in mlrun chart
  fullnameOverride: nuclio
  controller:
    enabled: true
  dashboard:
    enabled: true
    # nodePort - taken from global.nuclio.dashboard.nodePort for re-usability

    # k8s has deprecated docker support since v1.20
    containerBuilderKind: kaniko
    ingress:
      enabled: false

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
  autoscaler:
    enabled: false
  dlx:
    enabled: false
  rbac:
    create: true

    # do not allow nuclio to listen on all namespaces
    crdAccessMode: namespaced
  crd:
    create: true
  platform:
    logger:
      sinks:
        myStdoutLoggerSink:
          kind: stdout
          attributes:
            encoding: console
            timeFieldName: time
            timeFieldEncoding: iso8601
      system:
        - level: debug
          sink: myStdoutLoggerSink
      functions:
        - level: debug
          sink: myStdoutLoggerSink
    projectsLeader:
      kind: mlrun
      synchronizationInterval: 10m
      apiAddress: http://mlrun-api-chief:8080/api

mlrun:
  # set the type of filesystem to use: filesystem, s3
  enabled: true
  global:
    registry: *userRegistry
  defaultFunctionPodResources:
    limits:
      cpu: "2"
      memory: "20Gi"
    requests:
      cpu: "25m"
      memory: "1Mi"
  storage: filesystem
  storageAutoMountParams: ~
  secrets:
    s3:
      accessKey: ""
      secretKey: ""
  s3:
    region: us-east-1
    regionEndpoint: s3.us-east-1.amazonaws.com
    bucket: mlrun
    encrypt: false
    secure: true
  fullnameOverride: mlrun
  nuclio:
    mode: enabled
  rbac:
    create: true
  v3io:
    enabled: false
  api:
    image:
      tag: 1.11.0-rc28
    ingress:
      enabled: false
      annotations: {}
    sidecars:
      logCollector:
        image:
          tag: 1.11.0-rc28
        enabled: true
    fullnameOverride: mlrun-api
    functionSpecServiceAccountDefault: ~
    service:
      type: NodePort
      nodePort: 30070
    volumes:
      storageOverride:
        persistentVolumeClaim:
          claimName: mlrun-api-pvc
    persistence:
      enabled: true
      existingClaim:
      storageClass:
      accessMode: "ReadWriteOnce"
      size: "8Gi"
      annotations:
        helm.sh/resource-policy: "keep"
    envFrom:
      - configMapRef:
          name: mlrun-common-env
      - secretRef:
          name: s3-credentials
          optional: true
      - configMapRef:
          name: mlrun-pipelines-config
          optional: true
      - configMapRef:
          name: mlrun-spark-config
          optional: true
      - configMapRef:
          name: mlrun-override-env
          optional: true
    extraPersistentVolumeMounts: ~

    # Set mlrun api workers count by setting the minReplicas value.
    # This is recommended for production environments running at high scale.
    # more informatino on https://github.com/v3io/helm-charts/blob/7add12015d51f7ce500a71cb40fbb658b2c9ff3d/stable/mlrun/values.yaml#L99-L102
    # worker:
      # minReplicas: 1

    # Enable microservices is recommended for production environments running at high scale.
    # more information on https://github.com/v3io/helm-charts/blob/7add12015d51f7ce500a71cb40fbb658b2c9ff3d/stable/mlrun/values.yaml#L8-L53
    # microservices:
      # enabled: false
      # services:
      # - name: alerts

  ui:
    image:
      tag: 1.11.0-rc28
    fullnameOverride: mlrun-ui
    ingress:
      enabled: false
    service:
      type: NodePort
      nodePort: 30060
  db:
    name: db
    fullnameOverride: mlrun-db
    securityContext:
      runAsUser: 999
    podSecurityContext:
      runAsUser: 999
      fsGroup: 999
    volumes:
      storageOverride:
        persistentVolumeClaim:
          claimName: mlrun-db-pvc
    persistence:
      enabled: true
      existingClaim:
      storageClass:
      accessMode: "ReadWriteOnce"
      size: "8Gi"
      annotations:
        helm.sh/resource-policy: "keep"

  httpDB:
    dbType: mysql
    dirPath: "/mlrun/db"
    dsn: mysql+pymysql://root@mlrun-db:3306/mlrun
    oldDsn: sqlite:////mlrun/db/mlrun.db?check_same_thread=false
  modelMonitoring:
    # If no dsn has been provided, will initiate monitoring database under mlrun-db service:
    # mysql+pymysql://root@mlrun-db:3306/mlrun_model_monitoring
    dsn:
  ce:
    mode: full

jupyterNotebook:
  serviceAccount:
    create: true
    name: mlrun-jupyter
  awsInstall: false
  fullnameOverride: mlrun-jupyter
  name: jupyter-notebook
  enabled: true
  service:
    type: NodePort
    nodePort: 30040
    port: 8888
  ingress:
    enabled: false
    annotations: {}
    ingressClassName: ""

    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths: []
    tls: []

    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  image:
    repository: quay.io/mlrun/jupyter
    tag: 1.11.0-rc28
    pullPolicy: IfNotPresent
    pullSecrets: []
  busybox:
    image: busybox
    tag: 1.37
  ce:
    mode: full

  # use this to override mlrunUIURL, by default it will be auto-resolved to externalHostAddress and
  # mlrun UI node port
  mlrunUIURL:
  extraEnvKeyValue: {}
  envFrom:
    - configMapRef:
        name: jupyter-common-env
        optional: true
    - secretRef:
        name: s3-credentials
        optional: true
  persistence:
    enabled: true
    existingClaim:
    storageClass:
    accessMode: "ReadWriteOnce"
    size: "8Gi"
    annotations:
      helm.sh/resource-policy: "keep"

  nodeSelector:
    {}
    # node-role.kubernetes.io/node: "true"
    # tier: cs
  tolerations:
    []
    #  - key: "node-role.kubernetes.io/master"
    #    effect: NoSchedule

mpi-operator:
  fullnameOverride: mpi-operator
  crd:
    create: true
  rbac:
    clusterResources:
      create: true
    namespaced:
      create: true
  deployment:
    create: true

seaweedfs:
  enabled: true
  global:
    # Override parent chart's global.registry (which is a map) with empty string
    # to prevent "map[secretName:<nil> url:mustprovide]" in image names
    registry: ""
    # Override default "001" to "000" for single-node setup (no replication)
    replicationPlacement: "000"

  # Master server - metadata management
  master:
    port: 9333
    # Storage: use PVC instead of default hostPath
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    logs:
      type: "emptyDir"
    resources:
      requests:
        memory: 128Mi

  # Volume server - actual data storage
  volume:
    port: 8080
    # Storage: use PVC instead of default hostPath
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "10Gi"
        maxVolumes: 0
    logs:
      type: "emptyDir"
    resources:
      requests:
        memory: 256Mi

  # Filer server - file system interface
  filer:
    port: 8888
    # Storage: use PVC instead of default hostPath
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    logs:
      type: "emptyDir"
    # Filer's embedded S3 gateway
    s3:
      enabled: true
      port: 8333
    resources:
      requests:
        memory: 128Mi

  # S3 API gateway - MLRun connects to this endpoint
  s3:
    enabled: true  # Default is false
    port: 8333
    enableAuth: true  # Default is false
    # SeaweedFS S3 IAM configuration secret - defines authorized users/credentials
    # and their permissions for S3 API access (Admin, Read, List, Write, etc.)
    # Created by templates/seaweedfs/seaweedfs-s3-config.yaml using s3.accessKey/secretKey
    existingConfigSecret: "seaweedfs-s3-config"
    resources:
      requests:
        memory: 128Mi

  # Admin server - user and policy management UI
  admin:
    enabled: true  # Default is false
    port: 23646
    secret:
      adminUser: "minio"
      adminPassword: "minio123"
    dataDir: "/data"
    # Storage: use PVC instead of default emptyDir
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    resources:
      requests:
        memory: 64Mi

  # Custom NodePort service for Admin UI external access
  adminService:
    type: NodePort
    port: 23646
    nodePort: 30093
    ingress:
      enabled: false
      className: ""
      host: ""
      path: /
      pathType: Prefix
      annotations: {}
      tls: []

spark-operator:
  enabled: true
  fullnameOverride: spark-operator
  controller:
    serviceName: spark-operator-webhook
  webhook:
    enable: true
  spark:
    # User should set this value accordingly when installing in another namespace
    jobNamespaces:
      - mlrun
    serviceAccount:
      name: sparkapp

pipelines:
  enabled: true
  name: pipelines
  ui:
    enabled: false
  service:
    type: NodePort
    nodePort: 30100
  crd:
    enabled: true
  priority_class:
    enabled: true
  persistence:
    enabled: true
    existingClaim:
    storageClass:
    accessMode: "ReadWriteOnce"
    size: "20Gi"
    annotations:
      helm.sh/resource-policy: "keep"
  nodeSelector:
    {}
    # node-role.kubernetes.io/node: "true"
    # tier: cs
  tolerations:
    []
    #  - key: "node-role.kubernetes.io/master"
    #    effect: NoSchedule
  db:
    username: root
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
  images:
    driver:
      repository: ghcr.io/kubeflow/kfp-driver
      tag: 2.14.3
    launcher:
      repository: ghcr.io/kubeflow/kfp-launcher
      tag: 2.14.3
    argoexec:
      repository: gcr.io/iguazio/argoexec
      tag: v3.4.17-license-compliance
    workflowController:
      repository: gcr.io/iguazio/workflow-controller
      tag: v3.4.17-license-compliance
    apiServer:
      repository: ghcr.io/kubeflow/kfp-api-server
      tag: 2.14.3
    persistenceagent:
      repository: ghcr.io/kubeflow/kfp-persistence-agent
      tag: 2.14.3
    scheduledworkflow:
      repository: ghcr.io/kubeflow/kfp-scheduled-workflow-controller
      tag: 2.14.3
    ui:
      repository: ghcr.io/kubeflow/kfp-frontend
      tag: 2.14.3
    viewerCrdController:
      repository: ghcr.io/kubeflow/kfp-viewer-crd-controller
      tag: 2.14.3
    visualizationServer:
      repository: ghcr.io/kubeflow/kfp-visualization-server
      tag: 2.14.3
    metadata:
      container:
        repository: gcr.io/tfx-oss-public/ml_metadata_store_server
        tag: 1.16.0
    metadataEnvoy:
      repository: ghcr.io/kubeflow/kfp-metadata-envoy
      tag: 2.14.3
    metadataWriter:
      repository: ghcr.io/kubeflow/kfp-metadata-writer
      tag: 2.14.3
    mysql:
      # MySQL 8.0.26 because >= 8.0.27 has deprecated the default_authentication_plugin option
      # which is required by MLMD workloads (metadata-grpc-deployment and metadata-writer).
      # https://dev.mysql.com/doc/refman/8.0/en/server-system-variables.html#sysvar_default_authentication_plugin
      repository: gcr.io/iguazio/mysql
      tag: "8.0.26"
    cacheImage:
      repository: gcr.io/google-containers/busybox
      tag: latest

kube-prometheus-stack:
  fullnameOverride: monitoring
  enabled: true
  prometheusOperator:
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
  alertmanager:
    enabled: false
  grafana:
    adminUser: admin
    adminPassword: admin
    initChownData:
      enabled: false
    additionalDataSources:
      - name: iguazio
        type: mysql
        url: mlrun-db:3306
        user: root
        password:
        database: mlrun_model_monitoring
        editable: true
        maxOpenConns: 100
        maxIdleConns: 100
        maxIdleConnsAuto: true
    persistence:
      type: pvc
      enabled: true
      size: 10Gi
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Editor
    fullnameOverride: grafana
    enabled: true
    service:
      type: NodePort
      nodePort: 30010
    ingress:
      enabled: false
  prometheus:
    enabled: true
    service:
      type: NodePort
      nodePort: 30020
  kube-state-metrics:
    fullnameOverride: state-metrics
prometheus-node-exporter:
  fullnameOverride: node-exporter
  hostNetwork: false
  service:
    port: 9100
  hostRootFsMount:
    enabled: false

timescaledb:
  enabled: true
  fullnameOverride: timescaledb
  image:
    repository: timescale/timescaledb-ha
    tag: "pg17.7-ts2.24.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 5432
    nodePort: 30110
  auth:
    username: postgres
    password: postgres
    database: postgres
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: ""
    accessMode: "ReadWriteOnce"
    annotations:
      helm.sh/resource-policy: "keep"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
  nodeSelector: {}
  tolerations: []

strimzi-kafka-operator:
  enabled: true
  watchAnyNamespace: true
#  defaultImageRegistry: quay.io
#  defaultImageRepository: strimzi
#  defaultImageTag: 0.48.0

kafka:
  enabled: true
  name: kafka-stream

  # Bootstrap service alias configuration
  bootstrapAlias:
    # Create a service alias for simpler Kafka bootstrap server name
    # When enabled, creates: {name}.{namespace}.svc.cluster.local:9092
    # instead of the default: {name}-kafka-bootstrap.{namespace}.svc.cluster.local:9092
    enabled: true
    # Name for the bootstrap service alias (only used if enabled is true)
    name: kafka-stream

  # ============================================================================
  # INGRESS TCP PROXY CONFIGURATION
  # ============================================================================
  # Creates a ConfigMap entry for ingress-nginx to proxy external Kafka traffic.
  # This MERGES with existing tcp-services ConfigMap entries, preserving other TCP services.
  #
  # This provides similar behavior to the old Bitnami Kafka setup:
  # - Clients connect to the ingress controller on port 9094
  # - Traffic is proxied through ingress: ingress:9094 → kafka-bootstrap:9092
  # - Works from inside pods (with hairpin NAT) accessing via the ingress hostname
  #
  # ============================================================================
  # IMPORTANT LIMITATIONS
  # ============================================================================
  #
  # 1. PORT-BASED ROUTING ONLY (no hostname isolation)
  #    The ingress-nginx TCP proxy routes by PORT only, not by hostname/SNI.
  #    The hostname (e.g., kafka.<ns>.<cluster>.domain) is just DNS pointing to
  #    the ingress controller - it does NOT provide namespace isolation.
  #    Each Kafka installation MUST use a unique externalPort cluster-wide.
  #
  # 2. EXTERNAL CLIENT LIMITATION
  #    This proxy forwards to the internal Kafka listener (9092). Kafka returns
  #    broker metadata with INTERNAL DNS names (e.g., kafka-0.kafka-brokers.mlrun).
  #    - IN-CLUSTER CLIENTS: Work correctly - internal DNS resolves properly
  #    - EXTERNAL CLIENTS: May fail after bootstrap if they cannot resolve
  #      internal DNS names. For true external access, consider:
  #      - Using NodePort listener with advertisedHost configured, OR
  #      - Configuring Kafka to advertise the ingress hostname/port
  #    - SINGLE-BROKER SETUPS: External clients may work since bootstrap = broker
  #
  # 3. PRIMARY USE CASE
  #    This feature is primarily designed for in-cluster clients that need to
  #    access Kafka via the ingress hostname (hairpin NAT scenario), matching
  #    how the old Bitnami Kafka setup worked.
  #
  # NOTE: This works ALONGSIDE the NodePort external listener (both can be enabled).
  # The ingress TCP proxy forwards to the internal listener (9092), which is correct
  # for in-cluster clients because the internal listener is plaintext and Kafka
  # metadata returns addresses that resolve correctly via internal DNS.
  #
  # ============================================================================
  # PREREQUISITES - ingress-nginx must be configured for TCP services
  # ============================================================================
  #
  # This Helm chart ONLY creates the tcp-services ConfigMap entry. You must also
  # configure ingress-nginx to expose the TCP port. There are three requirements:
  #
  # 1. CONTROLLER ARG: Add --tcp-services-configmap argument
  #    The ingress-nginx controller must be started with:
  #      --tcp-services-configmap=$(POD_NAMESPACE)/tcp-services
  #
  #    If using the ingress-nginx Helm chart, add to values.yaml:
  #      controller:
  #        extraArgs:
  #          tcp-services-configmap: "$(POD_NAMESPACE)/tcp-services"
  #
  #    Or patch an existing deployment:
  #      kubectl patch deployment ingress-nginx-controller -n ingress-nginx \
  #        --type='json' -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-",
  #        "value":"--tcp-services-configmap=$(POD_NAMESPACE)/tcp-services"}]'
  #
  # 2. CONTAINER PORT: The controller pod must expose port 9094
  #    If using the ingress-nginx Helm chart, add to values.yaml:
  #      controller:
  #        containerPort:
  #          kafka-tcp: 9094
  #
  #    Or patch an existing deployment:
  #      kubectl patch deployment ingress-nginx-controller -n ingress-nginx \
  #        --type='json' -p='[{"op":"add","path":"/spec/template/spec/containers/0/ports/-",
  #        "value":{"containerPort":9094,"name":"kafka-tcp","protocol":"TCP"}}]'
  #
  # 3. SERVICE PORT: The ingress-nginx Service must expose port 9094
  #    If using the ingress-nginx Helm chart, add to values.yaml:
  #      tcp:
  #        9094: "<namespace>/kafka-stream-kafka-bootstrap:9092"
  #    (This also creates the tcp-services ConfigMap entry, making this chart's
  #     ConfigMap creation redundant but harmless due to merge behavior)
  #
  #    Or patch an existing service:
  #      kubectl patch svc ingress-nginx-controller -n ingress-nginx \
  #        --type='json' -p='[{"op":"add","path":"/spec/ports/-",
  #        "value":{"name":"kafka-tcp","port":9094,"targetPort":9094,"protocol":"TCP"}}]'
  #
  # ============================================================================
  # COMPLETE INGRESS-NGINX HELM VALUES EXAMPLE
  # ============================================================================
  # If installing ingress-nginx via Helm, use these values for Kafka TCP support:
  #
  #   controller:
  #     extraArgs:
  #       tcp-services-configmap: "$(POD_NAMESPACE)/tcp-services"
  #     containerPort:
  #       kafka-tcp: 9094
  #   tcp:
  #     9094: "mlrun/kafka-stream-kafka-bootstrap:9092"
  #
  # ============================================================================
  # VERIFICATION STEPS
  # ============================================================================
  #
  # 1. Verify controller has tcp-services-configmap arg:
  #    kubectl get deployment ingress-nginx-controller -n ingress-nginx \
  #      -o jsonpath='{.spec.template.spec.containers[0].args}' | grep tcp-services
  #
  # 2. Verify controller pod exposes port 9094:
  #    kubectl get deployment ingress-nginx-controller -n ingress-nginx \
  #      -o jsonpath='{.spec.template.spec.containers[0].ports[*].containerPort}'
  #    # Should include: 9094
  #
  # 3. Verify service exposes port 9094:
  #    kubectl get svc ingress-nginx-controller -n ingress-nginx \
  #      -o jsonpath='{.spec.ports[*].port}'
  #    # Should include: 9094
  #
  # 4. Verify tcp-services ConfigMap has the Kafka entry:
  #    kubectl get configmap tcp-services -n ingress-nginx -o yaml
  #    # Should show: "9094": "<namespace>/kafka-stream-kafka-bootstrap:9092"
  #
  # 5. Verify nginx is listening on port 9094:
  #    POD=$(kubectl get pods -n ingress-nginx -l app.kubernetes.io/component=controller \
  #      -o jsonpath='{.items[0].metadata.name}')
  #    kubectl exec -n ingress-nginx $POD -- cat /etc/nginx/nginx.conf | grep "listen.*9094"
  #
  # 6. Test TCP connectivity (from outside the release namespace):
  #    kubectl run test --image=alpine --rm -it --restart=Never -n ingress-nginx \
  #      -- sh -c "apk add netcat-openbsd && nc -zv ingress-nginx-controller 9094"
  #
  # ============================================================================
  # PORT UNIQUENESS (TCP proxy routes by PORT, not hostname)
  # ============================================================================
  # IMPORTANT: Each externalPort can only be used by ONE Kafka installation cluster-wide.
  # The ingress-nginx TCP proxy routes traffic based on PORT only - hostnames like
  # kafka.ns1.cluster.domain and kafka.ns2.cluster.domain do NOT provide isolation.
  # They are just DNS aliases pointing to the same ingress controller.
  #
  # If deploying multiple Kafka instances across namespaces, each must use a unique
  # externalPort (e.g., 9094, 9095, 9096). The default port 9094 can only serve one namespace.
  # The chart will fail with an error if you try to use a port already mapped to another service.
  #
  # ============================================================================
  ingress:
    # Enable ingress TCP proxy (disabled by default)
    enabled: false
    # External port exposed by ingress-nginx (must be unique cluster-wide)
    # If another namespace already uses 9094, choose a different port (e.g., 9095)
    externalPort: 9094
    # Namespace where ingress-nginx is installed
    ingressNamespace: ingress-nginx
    # Name of the TCP services ConfigMap (default: tcp-services)
    tcpConfigMapName: tcp-services

  replicas: 1

  listeners:
    - name: client
      port: 9092
      type: internal
      tls: false
    - name: controller
      port: 9093
      type: internal
      tls: false
    # External listener for direct NodePort access (not used by ingress TCP proxy).
    # The ingress TCP proxy (kafka.ingress) routes to the internal 'client' listener (9092),
    # while this NodePort listener (9094/30094) is for clients connecting directly to nodes.
    - name: external
      port: 9094
      type: nodeport
      tls: false
      configuration:
        # NOTE: The bootstrap nodePort (30094) pins only the *bootstrap* service.
        # Strimzi also creates per-broker NodePort services. For single-replica
        # deployments (replicas=1), only the bootstrap port is needed for initial
        # connection. For multi-replica deployments, you may need to either:
        # - Open additional auto-assigned broker NodePorts, or
        # - Explicitly configure brokers[].nodePort per broker, or
        # - Use the ingress TCP proxy option instead (kafka.ingress.enabled)
        bootstrap:
          nodePort: 30094
        # For direct NodePort-based external access, set advertisedHost per broker:
        # brokers:
        #   - broker: 0
        #     advertisedHost: kafka.<namespace>.<system>.lab.iguazeng.com
        #     nodePort: 30095  # Optional: pin broker's nodePort (must be unique)
        #
        # NOTE: When using ingress TCP proxy (kafka.ingress.enabled=true), clients
        # connect via the ingress endpoint (kafka.<domain>:9094) and do NOT need
        # advertisedHost configured here. The ingress proxy handles routing.

  storage:
    type: persistent-claim
    size: 8Gi
    class: ""

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  config:
    # Replication settings for single-node setup
    default.replication.factor: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1

  zookeeper:
    replicas: 0

  # Kafka RBAC for user namespaces
  # Enable this when installing in user namespaces (mlrun, mlrun1, etc.)
  # When enabled, creates: ServiceAccount "kafka-client" + Role/RoleBinding + NetworkPolicy
  rbac:
    # Enable RBAC for this namespace to access Kafka
    enabled: true

    # Operator namespace (where Kafka operator/cluster is running)
    # Empty means "use the release namespace"
    # Example: "controller" if that's where you installed the operator
    operatorNamespace: ""
