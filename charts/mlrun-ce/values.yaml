# We use global values scope to multiplex the docker-registry details to both mlrun and nuclio
global:
  # External host/ip to reach the k8s node. This might take various values if k8s is run in a VM or a cloud env
  externalHostAddress: localhost
  registry: &userRegistry
    url: mustprovide
    secretName:
  nuclio:
    dashboard:
      nodePort: 30050
  infrastructure:
    # Defines infra flavour, for instance: standalone, onprem, aws, azure, gcp...
    kind: standalone
    # Defines k8s flavour, for instance: eks, aks, gcp, kubespray, openshift, rancher, minikube...
    provider: ~
    inboundCidrs: ~
    loadBalancerName: ~
    aws:
      bucketName: ~
      s3NonAnonymous: false
      domainNameCertificate: ~

# =============================================================================
# S3-compatible storage configuration for MLRun and Jupyter.
# Kubeflow Pipelines always uses the bundled SeaweedFS — storage.mode only
# affects MLRun and Jupyter.
# =============================================================================

# storage.mode selects which backend credentials are injected into the 'storage-credentials' Secret.
# Options:
#   local (default) - bundled SeaweedFS; injects AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#                     and AWS_ENDPOINT_URL_S3 pointing at the in-cluster SeaweedFS S3 service.
#                     Credentials come from storage.local.accessKey/secretKey; artifact path from
#                     storage.local.bucket.
#                     SeaweedFS IAM, bucket-init job, and KFP Pipelines always use storage.local.*
#                     regardless of storage.mode.
#   s3              - external AWS S3; injects AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY only
#                     into MLRun and Jupyter (no custom endpoint — SDK uses the standard AWS endpoint).
#                     Credentials come from storage.s3.accessKey/secretKey; artifact path from
#                     storage.s3.bucket (or global.infrastructure.aws.bucketName).
#                     KFP Pipelines continue to use storage.local.* unchanged.
#   azure-blob      - Azure Blob Storage; injects AZURE_STORAGE_* fields from storage.azure.*
storage:
  mode: local
  # Single source of truth for the in-cluster SeaweedFS.
  # Always used by: SeaweedFS IAM config, bucket-init job, and KFP Pipelines.
  # Also used by MLRun and Jupyter when mode is "local".
  local:
    accessKey: "seaweed"
    secretKey: "seaweed123"
    bucket: "mlrun"
  # External AWS S3 credentials — only applied to MLRun and Jupyter when mode is "s3".
  s3:
    accessKey: ""
    secretKey: ""
    bucket: ""
  azure:
    containerName: ""
    connectionString: ""
    accountName: ""
    accountKey: ""
    sasToken: ""
    clientSecret: ""
    tenantId: ""

nuclio:
  global:
    registry: *userRegistry
  # coupled with mlrun.nuclio.dashboardName template in mlrun chart
  fullnameOverride: nuclio
  controller:
    enabled: true
  dashboard:
    enabled: true
    # nodePort - taken from global.nuclio.dashboard.nodePort for re-usability

    # k8s has deprecated docker support since v1.20
    containerBuilderKind: kaniko
    ingress:
      enabled: false

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
  autoscaler:
    enabled: false
  dlx:
    enabled: false
  rbac:
    create: true

    # do not allow nuclio to listen on all namespaces
    crdAccessMode: namespaced
  crd:
    create: true
  platform:
    logger:
      sinks:
        myStdoutLoggerSink:
          kind: stdout
          attributes:
            encoding: console
            timeFieldName: time
            timeFieldEncoding: iso8601
      system:
        - level: debug
          sink: myStdoutLoggerSink
      functions:
        - level: debug
          sink: myStdoutLoggerSink
    projectsLeader:
      kind: mlrun
      synchronizationInterval: 10m
      apiAddress: http://mlrun-api-chief:8080/api
    # Default labels/env applied to all Nuclio function deployments.
    # NOTE: functionDefaults.metadata.* sets values on the NuclioFunction CR object itself,
    # NOT on the pod template. Therefore:
    #   - mlrun.io/otel label below is on the CR, not the pod (informational only).
    #   - OTel Python auto-instrumentation requires the inject-python annotation on the POD.
    #     Users must add this explicitly when deploying a function:
    #
    #       fn.with_annotations({
    #           "instrumentation.opentelemetry.io/inject-python": "mlrun-otel-instrumentation"
    #       })
    #
    #     See: charts/mlrun-ce/templates/NOTES.txt for post-install instructions.
    # OTEL_SERVICE_NAME uses the stable function name (nuclio.io/function-name label)
    # so metrics survive function redeployments without creating new Prometheus series.
    functionDefaults:
      metadata:
        labels:
          mlrun.io/otel: "true"
      spec:
        env:
          - name: OTEL_SERVICE_NAME
            valueFrom:
              fieldRef:
                fieldPath: "metadata.labels['nuclio.io/function-name']"

mlrun:
  # set the type of filesystem to use: filesystem, s3
  enabled: true
  global:
    registry: *userRegistry
  defaultFunctionPodResources:
    limits:
      cpu: "2"
      memory: "20Gi"
    requests:
      cpu: "25m"
      memory: "1Mi"
  storage: filesystem
  # Storage auto-mount configuration for SeaweedFS S3-compatible storage
  # This allows MLRun SDK to automatically mount storage without user-provided params
  storageAutoMountType: secret_env
  storageAutoMountParams: ~
  secrets:
    s3:
      accessKey: ""
      secretKey: ""
  s3:
    region: us-east-1
    regionEndpoint: s3.us-east-1.amazonaws.com
    bucket: mlrun
    encrypt: false
    secure: true
  fullnameOverride: mlrun
  nuclio:
    mode: enabled
  rbac:
    create: true
  v3io:
    enabled: false
  api:
    image:
      tag: 1.12.0-rc18
    ingress:
      enabled: false
      annotations: {}
    sidecars:
      logCollector:
        image:
          tag: 1.12.0-rc18
        enabled: true
    fullnameOverride: mlrun-api
    functionSpecServiceAccountDefault: ~
    service:
      type: NodePort
      nodePort: 30070
    volumes:
      storageOverride:
        persistentVolumeClaim:
          claimName: mlrun-api-pvc
    persistence:
      enabled: true
      existingClaim:
      storageClass:
      accessMode: "ReadWriteOnce"
      size: "8Gi"
      annotations:
        helm.sh/resource-policy: "keep"
    envFrom:
      - configMapRef:
          name: mlrun-common-env
      - secretRef:
          name: storage-credentials
          optional: true
      - configMapRef:
          name: mlrun-pipelines-config
          optional: true
      - configMapRef:
          name: mlrun-spark-config
          optional: true
      - configMapRef:
          name: mlrun-override-env
          optional: true
    extraPersistentVolumeMounts: ~

    # Set mlrun api workers count by setting the minReplicas value.
    # This is recommended for production environments running at high scale.
    # more informatino on https://github.com/v3io/helm-charts/blob/7add12015d51f7ce500a71cb40fbb658b2c9ff3d/stable/mlrun/values.yaml#L99-L102
    # worker:
      # minReplicas: 1

    # Enable microservices is recommended for production environments running at high scale.
    # more information on https://github.com/v3io/helm-charts/blob/7add12015d51f7ce500a71cb40fbb658b2c9ff3d/stable/mlrun/values.yaml#L8-L53
    # microservices:
      # enabled: false
      # services:
      # - name: alerts

  ui:
    image:
      tag: 1.12.0-rc18
    fullnameOverride: mlrun-ui
    ingress:
      enabled: false
    service:
      type: NodePort
      nodePort: 30060
  db:
    name: db
    fullnameOverride: mlrun-db
    securityContext:
      runAsUser: 999
    podSecurityContext:
      runAsUser: 999
      fsGroup: 999
    volumes:
      storageOverride:
        persistentVolumeClaim:
          claimName: mlrun-db-pvc
    persistence:
      enabled: true
      existingClaim:
      storageClass:
      accessMode: "ReadWriteOnce"
      size: "8Gi"
      annotations:
        helm.sh/resource-policy: "keep"

  httpDB:
    dbType: mysql
    dirPath: "/mlrun/db"
    dsn: mysql+pymysql://root@mlrun-db:3306/mlrun
    oldDsn: sqlite:////mlrun/db/mlrun.db?check_same_thread=false
  modelMonitoring:
    # If no dsn has been provided, will initiate monitoring database under mlrun-db service:
    # mysql+pymysql://root@mlrun-db:3306/mlrun_model_monitoring
    dsn:
  ce:
    mode: full

jupyterNotebook:
  serviceAccount:
    create: true
    name: mlrun-jupyter
  awsInstall: false
  fullnameOverride: mlrun-jupyter
  name: jupyter-notebook
