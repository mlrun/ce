# We use global values scope to multiplex the docker-registry details to both mlrun and nuclio
global:
  # External host/ip to reach the k8s node. This might take various values if k8s is run in a VM or a cloud env
  externalHostAddress: localhost
  registry: &userRegistry
    url: mustprovide
    secretName:
  nuclio:
    dashboard:
      nodePort: 30050
  infrastructure:
    # Defines infra flavour, for instance: standalone, onprem, aws, azure, gcp...
    kind: standalone
    # Defines k8s flavour, for instance: eks, aks, gcp, kubespray, openshift, rancher, minikube...
    provider: ~
    inboundCidrs: ~
    loadBalancerName: ~
    aws:
      bucketName: ~
      s3NonAnonymous: false
      domainNameCertificate: ~

# =============================================================================
# S3-compatible storage configuration
# These credentials are used by MLRun, Jupyter, and Kubeflow Pipelines
# to access the storage backend.
# =============================================================================

# storage.mode selects which backend credentials are injected into the 'storage-credentials' Secret.
# Options:
#   s3 (default) - uses storage.s3.accessKey/secretKey/bucket with SeaweedFS endpoint
#   azure-blob   - uses storage.azure.* fields
storage:
  mode: s3
  s3:
    accessKey: "seaweed"
    secretKey: "seaweed123"
    bucket: "mlrun"
  azure:
    containerName: ""
    connectionString: ""
    accountName: ""
    accountKey: ""
    sasToken: ""
    clientSecret: ""
    tenantId: ""

nuclio:
  global:
    registry: *userRegistry
  # coupled with mlrun.nuclio.dashboardName template in mlrun chart
  fullnameOverride: nuclio
  controller:
    enabled: true
  dashboard:
    enabled: true
    # nodePort - taken from global.nuclio.dashboard.nodePort for re-usability

    # k8s has deprecated docker support since v1.20
    containerBuilderKind: kaniko
    ingress:
      enabled: false

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
  autoscaler:
    enabled: false
  dlx:
    enabled: false
  rbac:
    create: true

    # do not allow nuclio to listen on all namespaces
    crdAccessMode: namespaced
  crd:
    create: true
  platform:
    logger:
      sinks:
        myStdoutLoggerSink:
          kind: stdout
          attributes:
            encoding: console
            timeFieldName: time
            timeFieldEncoding: iso8601
      system:
        - level: debug
          sink: myStdoutLoggerSink
      functions:
        - level: debug
          sink: myStdoutLoggerSink
    projectsLeader:
      kind: mlrun
      synchronizationInterval: 10m
      apiAddress: http://mlrun-api-chief:8080/api
    # Default labels applied to all Nuclio function pods.
    # mlrun.io/otel marks function pods for OTel metric enrichment; the namespace-level
    # instrumentation annotation handles Python auto-instrumentation automatically.
    functionDefaults:
      metadata:
        labels:
          mlrun.io/otel: "true"

mlrun:
  # set the type of filesystem to use: filesystem, s3
  enabled: true
  global:
    registry: *userRegistry
  defaultFunctionPodResources:
    limits:
      cpu: "2"
      memory: "20Gi"
    requests:
      cpu: "25m"
      memory: "1Mi"
  storage: filesystem
  # Storage auto-mount configuration for SeaweedFS S3-compatible storage
  # This allows MLRun SDK to automatically mount storage without user-provided params
  storageAutoMountType: secret_env
  storageAutoMountParams: ~
  secrets:
    s3:
      accessKey: ""
      secretKey: ""
  s3:
    region: us-east-1
    regionEndpoint: s3.us-east-1.amazonaws.com
    bucket: mlrun
    encrypt: false
    secure: true
  fullnameOverride: mlrun
  nuclio:
    mode: enabled
  rbac:
    create: true
  v3io:
    enabled: false
  api:
    image:
      tag: 1.11.0-rc28
    ingress:
      enabled: false
      annotations: {}
    sidecars:
      logCollector:
        image:
          tag: 1.11.0-rc28
        enabled: true
    fullnameOverride: mlrun-api
    functionSpecServiceAccountDefault: ~
    service:
      type: NodePort
      nodePort: 30070
    volumes:
      storageOverride:
        persistentVolumeClaim:
          claimName: mlrun-api-pvc
    persistence:
      enabled: true
      existingClaim:
      storageClass:
      accessMode: "ReadWriteOnce"
      size: "8Gi"
      annotations:
        helm.sh/resource-policy: "keep"
    envFrom:
      - configMapRef:
          name: mlrun-common-env
      - secretRef:
          name: storage-credentials
          optional: true
      - configMapRef:
          name: mlrun-pipelines-config
          optional: true
      - configMapRef:
          name: mlrun-spark-config
          optional: true
      - configMapRef:
          name: mlrun-override-env
          optional: true
    extraPersistentVolumeMounts: ~
    # Explicitly expose the Docker image's PYTHONPATH as a K8s env var so that the
    # OpenTelemetry operator's PYTHONPATH injection (PYTHONPATH=/otel-auto-instrumentation-python:$(PYTHONPATH))
    # can expand $(PYTHONPATH) correctly. Without this, K8s env var substitution resolves
    # $(PYTHONPATH) to an empty string (it cannot see Docker image ENV vars), and the
    # mlrun `services` package path is lost, crashing the API on startup.
    extraEnvKeyValue:
      PYTHONPATH: "/mlrun/server/py:/mlrun/server/py/schemas/proto"

    # Set mlrun api workers count by setting the minReplicas value.
    # This is recommended for production environments running at high scale.
    # more informatino on https://github.com/v3io/helm-charts/blob/7add12015d51f7ce500a71cb40fbb658b2c9ff3d/stable/mlrun/values.yaml#L99-L102
    # worker:
      # minReplicas: 1

    # Enable microservices is recommended for production environments running at high scale.
    # more information on https://github.com/v3io/helm-charts/blob/7add12015d51f7ce500a71cb40fbb658b2c9ff3d/stable/mlrun/values.yaml#L8-L53
    # microservices:
      # enabled: false
      # services:
      # - name: alerts

  ui:
    image:
      tag: 1.11.0-rc28
    fullnameOverride: mlrun-ui
    ingress:
      enabled: false
    service:
      type: NodePort
      nodePort: 30060
  db:
    name: db
    fullnameOverride: mlrun-db
    securityContext:
      runAsUser: 999
    podSecurityContext:
      runAsUser: 999
      fsGroup: 999
    volumes:
      storageOverride:
        persistentVolumeClaim:
          claimName: mlrun-db-pvc
    persistence:
      enabled: true
      existingClaim:
      storageClass:
      accessMode: "ReadWriteOnce"
      size: "8Gi"
      annotations:
        helm.sh/resource-policy: "keep"

  httpDB:
    dbType: mysql
    dirPath: "/mlrun/db"
    dsn: mysql+pymysql://root@mlrun-db:3306/mlrun
    oldDsn: sqlite:////mlrun/db/mlrun.db?check_same_thread=false
  modelMonitoring:
    # If no dsn has been provided, will initiate monitoring database under mlrun-db service:
    # mysql+pymysql://root@mlrun-db:3306/mlrun_model_monitoring
    dsn:
  ce:
    mode: full

jupyterNotebook:
  serviceAccount:
    create: true
    name: mlrun-jupyter
  awsInstall: false
  fullnameOverride: mlrun-jupyter
  name: jupyter-notebook
  enabled: true
  service:
    type: NodePort
    nodePort: 30040
    port: 8888
  ingress:
    enabled: false
    annotations: {}
    ingressClassName: ""

    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths: []
    tls: []

    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  image:
    repository: quay.io/mlrun/jupyter
    tag: 1.11.0-rc28
    pullPolicy: IfNotPresent
    pullSecrets: []
  busybox:
    image: busybox
    tag: 1.37
  ce:
    mode: full

  # use this to override mlrunUIURL, by default it will be auto-resolved to externalHostAddress and
  # mlrun UI node port
  mlrunUIURL:
  extraEnvKeyValue: {}
  envFrom:
    - configMapRef:
        name: jupyter-common-env
        optional: true
    - secretRef:
        name: storage-credentials
        optional: true
  persistence:
    enabled: true
    existingClaim:
    storageClass:
    accessMode: "ReadWriteOnce"
    size: "8Gi"
    annotations:
      helm.sh/resource-policy: "keep"

  nodeSelector:
    {}
    # node-role.kubernetes.io/node: "true"
    # tier: cs
  tolerations:
    []
    #  - key: "node-role.kubernetes.io/master"
    #    effect: NoSchedule

mpi-operator:
  fullnameOverride: mpi-operator
  crd:
    create: true
  rbac:
    clusterResources:
      create: true
    namespaced:
      create: true
  deployment:
    create: true

seaweedfs:
  enabled: true
  global:
    # Override parent chart's global.registry (which is a map) with empty string
    # to prevent "map[secretName:<nil> url:mustprovide]" in image names
    registry: ""
    # Override default "001" to "000" for single-node setup (no replication)
    replicationPlacement: "000"
    # Disabled by default. Only needed if SeaweedFS master/volume pods need to
    # delete other pods during data migration (e.g., multi-node rebalancing).
    # Enabling this creates a ClusterRole, which conflicts in multi-NS deployments.
    createClusterRole: false

  # Master server - metadata management
  master:
    podLabels:
      mlrun.io/otel: "true"
    port: 9333
    # Storage: use PVC instead of default hostPath
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    logs:
      type: "emptyDir"
    resources:
      requests:
        memory: 128Mi

  # Volume server - actual data storage
  volume:
    podLabels:
      mlrun.io/otel: "true"
    port: 8080
    # Storage: use PVC instead of default hostPath
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "10Gi"
        maxVolumes: 0
    logs:
      type: "emptyDir"
    resources:
      requests:
        memory: 256Mi

  # Filer server - file system interface
  filer:
    podLabels:
      mlrun.io/otel: "true"
    port: 8888
    # Storage: use PVC instead of default hostPath
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    logs:
      type: "emptyDir"
    # Filer's embedded S3 gateway
    s3:
      enabled: true
      port: 8333
    resources:
      requests:
        memory: 128Mi

  # S3 API gateway - MLRun connects to this endpoint
  s3:
    podLabels:
      mlrun.io/otel: "true"
    enabled: true  # Default is false
    port: 8333
    enableAuth: true  # Default is false
    # SeaweedFS S3 IAM configuration secret - defines authorized users/credentials
    # and their permissions for S3 API access (Admin, Read, List, Write, etc.)
    # Created by templates/seaweedfs/seaweedfs-s3-config.yaml using s3.accessKey/secretKey
    existingConfigSecret: "seaweedfs-s3-config"
    resources:
      requests:
        memory: 128Mi

  # Admin server - user and policy management UI
  admin:
    podLabels:
      mlrun.io/otel: "true"
    enabled: true  # Default is false
    port: 23646
    secret:
      adminUser: "seaweed"
      adminPassword: "seaweed123"
    dataDir: "/data"
    # Storage: use PVC instead of default emptyDir
    data:
      type: "persistentVolumeClaim"
      size: "1Gi"
    resources:
      requests:
        memory: 64Mi

  # Custom NodePort service for Admin UI external access
  adminService:
    type: NodePort
    port: 23646
    nodePort: 30093
    ingress:
      enabled: false
      className: ""
      host: ""
      path: /
      pathType: Prefix
      annotations: {}
      tls: []

  # Custom NodePort service for S3 API external access
  s3Service:
    type: NodePort
    port: 8333
    nodePort: 30094

spark-operator:
  enabled: true
  fullnameOverride: spark-operator
  controller:
    serviceName: spark-operator-webhook
  webhook:
    enable: true
  spark:
    # User should set this value accordingly when installing in another namespace
    jobNamespaces:
      - mlrun
    serviceAccount:
      name: sparkapp

pipelines:
  archiveLogs: false
  enabled: true
  name: pipelines
  # Log level for KFP api-server (DEBUG, INFO, WARNING, ERROR)
  logLevel: INFO
  ui:
    enabled: false
  metadata:
    enabled: false
  service:
    type: NodePort
    nodePort: 30100
  crd:
    enabled: true
  priority_class:
    enabled: true
  persistence:
    enabled: true
    existingClaim:
    storageClass:
    accessMode: "ReadWriteOnce"
    size: "20Gi"
    annotations:
      helm.sh/resource-policy: "keep"
  nodeSelector:
    {}
    # node-role.kubernetes.io/node: "true"
    # tier: cs
  tolerations:
    []
    #  - key: "node-role.kubernetes.io/master"
    #    effect: NoSchedule
  db:
    username: root
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
  images:
    driver:
      repository: ghcr.io/kubeflow/kfp-driver
      tag: 2.15.0
    launcher:
      repository: ghcr.io/kubeflow/kfp-launcher
      tag: 2.15.0
    argoexec:
      repository: gcr.io/iguazio/argoexec
      tag: v3.4.17-license-compliance
    workflowController:
      repository: gcr.io/iguazio/workflow-controller
      tag: v3.4.17-license-compliance
    apiServer:
      repository: ghcr.io/kubeflow/kfp-api-server
      tag: 2.15.0
      busybox:
        repository: busybox
        tag: "1.36"
    persistenceagent:
      repository: ghcr.io/kubeflow/kfp-persistence-agent
      tag: 2.15.0
    scheduledworkflow:
      repository: ghcr.io/kubeflow/kfp-scheduled-workflow-controller
      tag: 2.15.0
    ui:
      repository: ghcr.io/kubeflow/kfp-frontend
      tag: 2.15.0
    viewerCrdController:
      repository: ghcr.io/kubeflow/kfp-viewer-crd-controller
      tag: 2.15.0
    visualizationServer:
      repository: ghcr.io/kubeflow/kfp-visualization-server
      tag: 2.15.0
    metadata:
      container:
        repository: gcr.io/tfx-oss-public/ml_metadata_store_server
        tag: 1.16.0
    metadataEnvoy:
      repository: ghcr.io/kubeflow/kfp-metadata-envoy
      tag: 2.15.0
    metadataWriter:
      repository: ghcr.io/kubeflow/kfp-metadata-writer
      tag: 2.15.0
    mysql:
      # MySQL 8.0.26 because >= 8.0.27 has deprecated the default_authentication_plugin option
      # which is required by MLMD workloads (metadata-grpc-deployment and metadata-writer).
      # https://dev.mysql.com/doc/refman/8.0/en/server-system-variables.html#sysvar_default_authentication_plugin
      repository: gcr.io/iguazio/mysql
      tag: "8.0.26"
    cacheImage:
      repository: gcr.io/google-containers/busybox
      tag: latest

kube-prometheus-stack:
  fullnameOverride: monitoring
  enabled: true
  prometheusOperator:
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
  alertmanager:
    enabled: false
  grafana:
    adminUser: admin
    adminPassword: admin
    initChownData:
      enabled: false
    additionalDataSources:
      - name: iguazio
        type: mysql
        url: mlrun-db:3306
        user: root
        password:
        database: mlrun_model_monitoring
        editable: true
        maxOpenConns: 100
        maxIdleConns: 100
        maxIdleConnsAuto: true
    persistence:
      type: pvc
      enabled: true
      size: 10Gi
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Editor
    fullnameOverride: grafana
    enabled: true
    service:
      type: NodePort
      nodePort: 30010
    ingress:
      enabled: false
  prometheus:
    enabled: true
    service:
      type: NodePort
      nodePort: 30020
    prometheusSpec:
      # Additional scrape configs for OpenTelemetry collector Deployment.
      # In deployment mode, one collector pod runs per namespace and receives OTLP from all
      # instrumented pods. Prometheus scrapes only the collector (port 8889), not individual pods.
      additionalScrapeConfigs:
        # Scrape the OTel Collector Deployment pod.
        # Discovers pods with app.kubernetes.io/component=opentelemetry-collector label
        # (applied automatically by the OTel operator to collector pods).
        - job_name: 'otel-collector'
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            # Only scrape the OTel collector pod
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
              action: keep
              regex: opentelemetry-collector
            # Use port 8889 (OTel prometheus exporter)
            - source_labels: [__address__]
              action: replace
              regex: ([^:]+)(?::\d+)?
              replacement: $1:8889
              target_label: __address__
            - target_label: __metrics_path__
              replacement: /metrics
            # Propagate pod labels as metric labels
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: kubernetes_namespace
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: kubernetes_pod_name
          metric_relabel_configs:
            - action: replace
              target_label: metrics_source
              replacement: otel_collector
  kube-state-metrics:
    fullnameOverride: state-metrics
prometheus-node-exporter:
  fullnameOverride: node-exporter
  hostNetwork: false
  service:
    port: 9100
  hostRootFsMount:
    enabled: false

timescaledb:
  enabled: true
  fullnameOverride: timescaledb
  image:
    repository: timescale/timescaledb-ha
    tag: "pg17.7-ts2.24.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 5432
    nodePort: 30110
  auth:
    username: postgres
    password: postgres
    database: postgres
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: ""
    accessMode: "ReadWriteOnce"
    annotations:
      helm.sh/resource-policy: "keep"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
  nodeSelector: {}
  tolerations: []
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

strimzi-kafka-operator:
  enabled: true
  watchAnyNamespace: true
#  defaultImageRegistry: quay.io
#  defaultImageRepository: strimzi
#  defaultImageTag: 0.48.0

kafka:
  enabled: true
  name: kafka-stream

  # Bootstrap service alias configuration
  bootstrapAlias:
    # Create a service alias for simpler Kafka bootstrap server name
    # When enabled, creates: {name}.{namespace}.svc.cluster.local:9092
    # instead of the default: {name}-kafka-bootstrap.{namespace}.svc.cluster.local:9092
    enabled: true
    # Name for the bootstrap service alias (only used if enabled is true)
    name: kafka-stream

  replicas: 1

  listeners:
    - name: client
      port: 9092
      type: internal
      tls: false
    - name: controller
      port: 9093
      type: internal
      tls: false
    - name: internal
      port: 9094
      type: internal
      tls: false

  storage:
    type: persistent-claim
    size: 8Gi
    class: ""

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  config:
    # Replication settings for single-node setup
    default.replication.factor: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1

  zookeeper:
    replicas: 0

  # Kafka RBAC for user namespaces
  # Enable this when installing in user namespaces (mlrun, mlrun1, etc.)
  # When enabled, creates: ServiceAccount "kafka-client" + Role/RoleBinding
  rbac:
    # Enable RBAC for this namespace to access Kafka
    enabled: true

    # Operator namespace (where Kafka operator/cluster is running)
    # Empty means "use the release namespace"
    # Example: "controller" if that's where you installed the operator
    operatorNamespace: ""

  # NetworkPolicy for Kafka isolation in multi-NS deployments
  egress:
    enabled: false
# Spark configuration for multi-NS deployments
# Controls CE-level spark resources (mlrun-spark-config ConfigMap)
# In single-NS mode, both spark.enabled and spark-operator.enabled are true
# In multi-NS admin mode, spark.enabled is false (no ConfigMap needed)
# In multi-NS user mode, spark.enabled is true (ConfigMap needed for MLRun)
spark:
  enabled: true

# =============================================================================
# OpenTelemetry Operator configuration
# Installs the OpenTelemetry Operator for managing collectors and instrumentation
# =============================================================================
opentelemetry-operator:
  enabled: false
  # Admission webhooks configuration
  admissionWebhooks:
    certManager:
      enabled: false
    autoGenerateCert:
      enabled: true
    # Only apply webhooks to namespaces with the opentelemetry label
    # This ensures the operator only monitors labeled namespaces
    namespaceSelector:
      matchLabels:
        opentelemetry.io/inject: "enabled"
  manager:
    # Collector image used by the operator when creating collectors
    collectorImage:
      # Using contrib distribution pinned to 0.108.0 — versions 0.109+ use a dynamically linked
      # binary in a distroless image that lacks /lib64/ld-linux-x86-64.so.2 and fails to exec.
      repository: otel/opentelemetry-collector-contrib
      tag: 0.108.0
    # Auto-instrumentation images (all fields required by the sub-chart schema)
    autoInstrumentationImage:
      python:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python
        tag: 0.50b0
      java:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java
        tag: 2.10.0
      nodejs:
        repository: ""
        tag: ""
      dotnet:
        repository: ""
        tag: ""
      go:
        repository: ""
        tag: ""
      apacheHttpd:
        repository: ""
        tag: ""
    # Feature gates as string (comma-separated)
    featureGates: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# =============================================================================
# OpenTelemetry Collector and Instrumentation CRs
# These are managed separately from the operator for admin/non-admin split
# =============================================================================
opentelemetry:
  # Namespace label for enabling OpenTelemetry monitoring.
  # When enabled, the post-install job labels the namespace and also annotates it with
  # instrumentation.opentelemetry.io/inject-python so all Python pods are auto-instrumented.
  namespaceLabel:
    enabled: false
    key: "opentelemetry.io/inject"
    value: "enabled"

  # OpenTelemetry Collector configuration (DEPLOYMENT mode)
  # A single collector Deployment runs per namespace, receiving OTLP from instrumented pods
  # and exporting metrics to Prometheus.
  collector:
    enabled: false
    nameOverride: ""
    fullnameOverride: ""
    # DEPLOYMENT mode - one collector pod per namespace, not injected as a sidecar
    mode: deployment
    # Collector sidecar container resources
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Prometheus exporter port for metrics
    prometheus:
      port: 8889
      # Metric prefix added to all OTEL-collected metrics
      # Helps distinguish OTEL metrics from directly-scraped metrics
      namespace: mlrun_otel
    # OTLP receiver configuration
    otlp:
      grpcPort: 4317
      httpPort: 4318

  # Instrumentation configuration for auto-instrumentation
  instrumentation:
    enabled: false
    nameOverride: ""
    fullnameOverride: ""
    # Propagators for distributed tracing context
    propagators:
      - tracecontext
      - baggage
    # Sampler configuration
    sampler:
      type: parentbased_traceidratio
      argument: "1"
    # Python auto-instrumentation
    python:
      enabled: true
      image:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python
        tag: 0.50b0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    # Java auto-instrumentation (disabled by default, enable if needed)
    java:
      enabled: false
      image:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java
        tag: 2.10.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi

