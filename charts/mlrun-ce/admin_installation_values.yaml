# Use this Values file for installing MLRun CE cluster resources such as: crd, cluster role on a namespace that will not use for
# the deployment's installation.
# After you installed the helm chart using this values file you will need to use the non_admin_cluster_ip_installtion_values.yaml
# or the non_admin__installtion_values.yaml for installing the mlrun ce deployments (support MLRun. mpi, nuclio and kfp pipeline installation)

# We use global values scope to multiplex the docker-registry details to both mlrun and nuclio
global:
  # External host/ip to reach the k8s node. This might take various values if k8s is run in a VM or a cloud env
  registry:
    url: false

nuclio:
  # coupled with mlrun.nuclio.dashboardName template in mlrun chart
  controller:
    enabled: false
  dashboard:
    enabled: false
  rbac:
    create: false
  platform: null

mlrun:
  enabled: false

jupyterNotebook:
  enabled: false
  serviceAccount:
    create: false
  persistence:
    enabled: false

mpi-operator:
  rbac:
    namespaced:
      create: false
  deployment:
    create: false

seaweedfs:
  enabled: false

spark-operator:
  enabled: true
  fullnameOverride: spark-operator
  controller:
    replicas: 0           # No running pods in admin
    rbac:
      create: true        # Creates ClusterRole (shared by all user namespaces)
    serviceAccount:
      create: true
  webhook:
    enable: true
    replicas: 1
  spark:
    jobNamespaces:
      - ""              # All namespaces (no namespaceSelector on webhook)
    serviceAccount:
      create: false       # No sparkapp SA in admin
    rbac:
      create: false

spark:
  enabled: false

pipelines:
  enabled: false
  storage:
    mode: local

kube-prometheus-stack:
  enabled: false

timescaledb:
  enabled: false

strimzi-kafka-operator:
  enabled: true
  watchAnyNamespace: true
  
kafka:
  enabled: false

# OpenTelemetry Operator - enabled for CRD installation at cluster level
opentelemetry-operator:
  enabled: true
  admissionWebhooks:
    certManager:
      enabled: false
    autoGenerateCert:
      enabled: true
    # Only apply webhooks to namespaces with the opentelemetry label
    namespaceSelector:
      matchLabels:
        opentelemetry.io/inject: "enabled"

# OpenTelemetry CRs - disabled at admin level, enabled in user namespaces
# Note: Controller namespace does NOT need the opentelemetry label since
# no workloads are instrumented here - only the operator runs here
opentelemetry:
  namespaceLabel:
    enabled: false
  collector:
    enabled: false
  instrumentation:
    enabled: false

