# Use this Values file for installing MLRun CE resources such as: deployments, non cluster resources (.e.g. crd, cluter role) and installing service as clusterIP.
# remember to use a different namespace that used for the cluster resource installation. (support MLRun. mpi, nuclio and kfp pipeline installation)

# We use global values scope to multiplex the docker-registry details to both mlrun and nuclio
global:
  nuclio:
    dashboard:
      nodePort: 30050

nuclio:
  crd:
    create: false

mlrun:
  api:
    service:
      type: NodePort
      nodePort: 30070
  ui:
    service:
      type: NodePort
      nodePort: 30060
jupyterNotebook:
  service:
    type: NodePort
    nodePort: 30040
    port: 8888

mpi-operator:
  fullnameOverride: mpi-operator
  crd:
    create: false
  rbac:
    clusterResources:
      create: false

seaweedfs:
  enabled: true

spark-operator:
  enabled: true
  fullnameOverride: spark-operator
  controller:
    replicas: 1           # Controller runs in user namespace
    rbac:
      create: false       # ClusterRole already exists from admin
    serviceAccount:
      create: true
    leaderElection:
      enable: true
  webhook:
    enable: false
  spark:
    jobNamespaces:
      - mlrun             # Override with actual namespace at install time
    serviceAccount:
      create: true
      name: sparkapp
    rbac:
      create: true        # Creates sparkapp Role + RoleBinding

spark:
  enabled: true

pipelines:
  service:
    type : NodePort
    nodePort: 30010
  crd:
    enabled: false
  priority_class:
    enabled: false

strimzi-kafka-operator:
  enabled: false
  
kafka:
  rbac:
    operatorNamespace: controller
  egress:
    enabled: true

kube-prometheus-stack:
  enabled: false

# OpenTelemetry Operator - disabled, CRDs installed at controller level
opentelemetry-operator:
  enabled: false

# OpenTelemetry CRs - enabled for user namespace
# The namespace will be labeled and annotated for OTel deployment-mode collection
# and namespace-wide Python auto-instrumentation.
opentelemetry:
  namespaceLabel:
    enabled: true
  collector:
    enabled: true
  instrumentation:
    enabled: true

