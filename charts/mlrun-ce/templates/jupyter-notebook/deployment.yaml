{{- if .Values.jupyterNotebook.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlrun-ce.jupyter.fullname" . }}
  labels:
    {{- include "mlrun-ce.jupyter.labels" . | nindent 4 }}
    {{- if and .Values.opentelemetry.collector.enabled .Values.opentelemetry.instrumentation.enabled }}
    {{- include "mlrun-ce.otel.podLabels" . | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mlrun-ce.jupyter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlrun-ce.jupyter.selectorLabels" . | nindent 8 }}
        {{- if and .Values.opentelemetry.collector.enabled .Values.opentelemetry.instrumentation.enabled }}
        {{- include "mlrun-ce.otel.podLabels" . | nindent 8 }}
        {{- end }}
      {{- if and .Values.opentelemetry.collector.enabled .Values.opentelemetry.instrumentation.enabled }}
      annotations:
        instrumentation.opentelemetry.io/inject-python: {{ include "mlrun-ce.otel.instrumentation.fullname" . | quote }}
      {{- end }}
    spec:
      {{- with .Values.jupyterNotebook.image.pullSecrets }}
      imagePullSecrets:
          {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if  .Values.jupyterNotebook.serviceAccount.name }}
      serviceAccount: {{ .Values.jupyterNotebook.serviceAccount.name }}
{{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: jupyter-notebook
        image: "{{ .Values.jupyterNotebook.image.repository }}:{{ .Values.jupyterNotebook.image.tag }}"
        imagePullPolicy: {{ .Values.jupyterNotebook.image.pullPolicy }}
        env:
        - name: MLRUN_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: MLRUN_DBPATH
          value: {{ printf "http://%s:%s" (include "mlrun-ce.mlrun.api.fullname" .) (include "mlrun-ce.mlrun.api.port" .) }}
        - name: MLRUN_UI__URL
          value: {{ template "mlrun-ce.jupyter.mlrunUIURL" . }}
        - name: MLRUN_MPIJOB_CRD_VERSION
          value: {{ index .Values "mpi-operator" "crd" "version" }}
{{- if  .Values.jupyterNotebook.persistence.enabled }}
        - name: MLRUN_PVC_MOUNT
          value: {{ printf "%s:/home/jovyan/" (include "mlrun-ce.jupyter.claimName" .) }}
{{- end }}
        - name: CHOWN_HOME
          value: "yes"
        - name: CHOWN_HOME_OPTS
          value: "-R"
        {{- if and .Values.opentelemetry.collector.enabled .Values.opentelemetry.instrumentation.enabled }}
        - name: OTEL_SERVICE_NAME
          value: {{ include "mlrun-ce.jupyter.fullname" . | quote }}
        {{- end }}
        {{- if .Values.jupyterNotebook.extraEnv }}
        {{ toYaml .Values.jupyterNotebook.extraEnv | nindent 8 }}
        {{- end }}
        {{- if .Values.jupyterNotebook.extraEnvKeyValue }}
        {{- range $name, $value := .Values.jupyterNotebook.extraEnvKeyValue }}
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.jupyterNotebook.envFrom }}
        envFrom:
        {{ toYaml .Values.jupyterNotebook.envFrom | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: /home/jovyan/
          name: notebooks
        ports:
        - containerPort: 8888
          name: http
        {{- if and .Values.opentelemetry.collector.enabled .Values.opentelemetry.instrumentation.enabled }}
        command:
          - /bin/bash
          - -c
          - |
            # Extract tar if needed (mirrors mlce-start.sh setup)
            file_path="${HOME}/.intdata"
            if [ ! -f "$file_path" ]; then
              echo "Base data does not exist, extracting home backup..."
              cd / && tar -xvf /tmp/basehome.tar
              echo "1" > "$file_path"
            fi
            cd "${HOME}"
            # Add OTel sitecustomize.py to PYTHONPATH so Jupyter's own Python
            # process bootstraps OTel directly (bypassing start-notebook.py which
            # strips the path to prevent re-instrumentation of subprocesses).
            OTEL_PATH=/otel-auto-instrumentation-python/opentelemetry/instrumentation/auto_instrumentation
            if [ -d "$OTEL_PATH" ]; then
              export PYTHONPATH="${OTEL_PATH}:${PYTHONPATH:-/otel-auto-instrumentation-python}"
            fi
            exec /opt/conda/bin/python3 /opt/conda/bin/jupyter-lab \
              --ip=0.0.0.0 \
              --port=8888 \
              --NotebookApp.token="" \
              --NotebookApp.password="" \
              --NotebookApp.allow_origin="*" \
              --NotebookApp.default_url=/lab
        {{- else }}
        command: ["/bin/bash", "/usr/local/bin/mlce-start.sh"]
        {{- end }}
      {{- with .Values.jupyterNotebook.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jupyterNotebook.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: notebooks
        persistentVolumeClaim:
{{- if .Values.jupyterNotebook.persistence.enabled }}
          claimName: {{ template "mlrun-ce.jupyter.claimName" . }}
{{- end }}
{{- end -}}
