{{- if eq (include "mlrun-ce.seaweedfs.remote.enabled" . | toString) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-remote-credentials
  labels:
    {{- include "mlrun-ce.common.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs-remote
type: Opaque
stringData:
  {{- if eq .Values.seaweedfs.remote.provider "s3" }}
  AWS_ACCESS_KEY_ID: {{ required "storage.s3.accessKey is required for seaweedfs.remote provider s3" .Values.storage.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "storage.s3.secretKey is required for seaweedfs.remote provider s3" .Values.storage.s3.secretKey | quote }}
  {{- else if eq .Values.seaweedfs.remote.provider "azure" }}
  # SeaweedFS remote.configure -type=azure reads AZURE_STORAGE_ACCOUNT and AZURE_STORAGE_ACCESS_KEY.
  # storage.azure.connectionString is parsed into those env vars by the remote-config Job when account key is omitted.
  # Not supported for seaweedfs.remote: AZURE_STORAGE_SAS_TOKEN, AZURE_STORAGE_CLIENT_SECRET, AZURE_STORAGE_TENANT_ID
  {{- with .Values.storage.azure.connectionString }}
  AZURE_STORAGE_CONNECTION_STRING: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.azure.accountName }}
  AZURE_STORAGE_ACCOUNT: {{ . | quote }}
  {{- end }}
  {{- with .Values.storage.azure.accountKey }}
  AZURE_STORAGE_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
