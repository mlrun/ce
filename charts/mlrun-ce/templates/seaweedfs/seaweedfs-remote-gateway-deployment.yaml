{{- if eq (include "mlrun-ce.seaweedfs.remote.enabled" . | toString) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-seaweedfs-remote-gateway
  labels:
    {{- include "mlrun-ce.common.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs-remote-gateway
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # After seaweedfs-remote-config (weight 11) so remote.configure / remote.mount finish first.
    helm.sh/hook-weight: "12"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mlrun-ce.common.labels" . | nindent 6 }}
      app.kubernetes.io/component: seaweedfs-remote-gateway
  template:
    metadata:
      labels:
        {{- include "mlrun-ce.common.labels" . | nindent 8 }}
        app.kubernetes.io/component: seaweedfs-remote-gateway
    spec:
      initContainers:
        - name: wait-for-filer
          image: busybox:1.36
          env:
            - name: FILER_HOST
              value: seaweedfs-all-in-one.{{ .Release.Namespace }}.svc.cluster.local
            - name: FILER_PORT
              value: "8888"
          command:
            - /bin/sh
            - -c
            - "until nc -z $FILER_HOST $FILER_PORT; do echo waiting for SeaweedFS filer; sleep 5; done"
      containers:
        - name: remote-gateway
          image: {{ include "mlrun-ce.seaweedfs.image" . | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/weed
            - filer.remote.gateway
          args:
            - -filer={{ include "mlrun-ce.seaweedfs.filerAddress" . }}
            - -createBucketAt={{ .Values.seaweedfs.remote.name }}
            - -createBucketWithRandomSuffix={{ .Values.seaweedfs.remote.gateway.createBucketWithRandomSuffix | default false }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
{{- end }}
