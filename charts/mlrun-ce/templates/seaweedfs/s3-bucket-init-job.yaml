{{- $remoteEnabled := eq (include "mlrun-ce.seaweedfs.remote.enabled" . | toString) "true" }}
{{- if .Values.seaweedfs.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-s3-bucket-init
  labels:
    {{- include "mlrun-ce.common.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3-bucket-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Before seaweedfs-remote-config (weight 9) when remote sync is enabled.
    helm.sh/hook-weight: {{ if $remoteEnabled }}"8"{{ else }}"10"{{ end }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "mlrun-ce.common.labels" . | nindent 8 }}
        app.kubernetes.io/component: s3-bucket-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-seaweedfs
        image: busybox:1.36
        env:
        - name: S3_HOST
          value: seaweedfs-s3.{{ .Release.Namespace }}.svc.cluster.local
        - name: S3_PORT
          value: {{ .Values.seaweedfs.s3.port | quote }}
        command:
        - /bin/sh
        - -c
        - "until nc -z $S3_HOST $S3_PORT; do sleep 5; done"
      containers:
      - name: create-bucket
        image: amazon/aws-cli:2.15.0
        env:
        - name: AWS_ACCESS_KEY_ID
          value: {{ include "mlrun-ce.seaweedfs.s3.accessKey" . | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ include "mlrun-ce.seaweedfs.s3.secretKey" . | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ include "mlrun-ce.s3.service.url" . | quote }}
        - name: PIPELINES_BUCKET
          value: {{ include "mlrun-ce.pipelines.s3.bucket" . | quote }}
        - name: MLRUN_LOCAL_BUCKET
          value: {{ .Values.storage.local.bucket | quote }}
        - name: STORAGE_MODE
          value: {{ .Values.storage.mode | quote }}
        # Region is required by the AWS CLI even though SeaweedFS ignores it.
        # Without it, botocore attempts IMDS region discovery and crashes (CEML-721).
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        # Fully disable IMDS lookups as defense-in-depth, independent of region.
        - name: AWS_EC2_METADATA_DISABLED
          value: "true"
        command:
        - /bin/sh
        - -ec
        - |
          ensure_bucket() {
            _name="$1"
            aws s3 mb "s3://${_name}" 2>&1 || aws s3 ls "s3://${_name}" 2>&1 || {
              echo "ERROR: Failed to create or verify bucket ${_name}"
              exit 1
            }
          }
          ensure_bucket "${PIPELINES_BUCKET}"
          if [ "${STORAGE_MODE}" = "local" ] && [ "${MLRUN_LOCAL_BUCKET}" != "${PIPELINES_BUCKET}" ]; then
            ensure_bucket "${MLRUN_LOCAL_BUCKET}"
          fi
{{- end }}
