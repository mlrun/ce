{{- if .Values.seaweedfs.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-s3-bucket-init
  labels:
    {{- include "mlrun-ce.common.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3-bucket-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "mlrun-ce.common.labels" . | nindent 8 }}
        app.kubernetes.io/component: s3-bucket-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-seaweedfs
        image: busybox:1.36
        env:
        - name: S3_HOST
          value: seaweedfs-s3.{{ .Release.Namespace }}.svc.cluster.local
        - name: S3_PORT
          value: {{ .Values.seaweedfs.s3.port | quote }}
        command:
        - /bin/sh
        - -c
        - "until nc -z $S3_HOST $S3_PORT; do sleep 5; done"
      containers:
      - name: create-bucket
        image: amazon/aws-cli:2.15.0
        env:
        - name: AWS_ACCESS_KEY_ID
          value: {{ include "mlrun-ce.seaweedfs.s3.accessKey" . | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ include "mlrun-ce.seaweedfs.s3.secretKey" . | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ include "mlrun-ce.s3.service.url" . | quote }}
        - name: BUCKET_NAME
          value: {{ include "mlrun-ce.seaweedfs.s3.bucket" . | quote }}
        # Region is required by the AWS CLI even though SeaweedFS ignores it.
        # Without it, botocore attempts IMDS region discovery and crashes (CEML-721).
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        # Fully disable IMDS lookups as defense-in-depth, independent of region.
        - name: AWS_EC2_METADATA_DISABLED
          value: "true"
        command:
        - /bin/sh
        - -c
        - "aws s3 mb s3://$BUCKET_NAME 2>&1 || aws s3 ls s3://$BUCKET_NAME 2>&1 || { echo \"ERROR: Failed to create or verify bucket $BUCKET_NAME\"; exit 1; }"
{{- end }}
