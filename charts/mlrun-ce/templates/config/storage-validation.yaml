{{- if and (eq .Values.storage.mode "s3") (not .Values.storage.s3.bucket) (not .Values.global.infrastructure.aws.bucketName) }}
{{ fail "storage.mode is set to \"s3\" but storage.s3.bucket is not provided. Please set storage.s3.bucket." }}
{{- end }}
{{- if and (eq .Values.storage.mode "s3") (not .Values.global.infrastructure.aws.s3NonAnonymous) (not .Values.storage.s3.accessKey) }}
{{ fail "storage.mode is set to \"s3\" but storage.s3.accessKey is empty. Set storage.s3.accessKey, or set global.infrastructure.aws.s3NonAnonymous=true to use IAM role-based access." }}
{{- end }}
{{- if and (eq .Values.storage.mode "s3") (not .Values.global.infrastructure.aws.s3NonAnonymous) (not .Values.storage.s3.secretKey) }}
{{ fail "storage.mode is set to \"s3\" but storage.s3.secretKey is empty. Set storage.s3.secretKey, or set global.infrastructure.aws.s3NonAnonymous=true to use IAM role-based access." }}
{{- end }}
{{- if and (eq .Values.storage.mode "local") (not .Values.storage.local.bucket) }}
{{ fail "storage.mode is set to \"local\" but storage.local.bucket is not provided. Please set storage.local.bucket." }}
{{- end }}
{{- if and (eq .Values.storage.mode "azure-blob") (not .Values.storage.azure.containerName) }}
{{ fail "storage.mode is set to \"azure-blob\" but storage.azure.containerName is not provided. Please set storage.azure.containerName." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (eq .Values.storage.mode "local") }}
{{ fail "seaweedfs.remote requires storage.mode \"s3\" or \"azure-blob\" so MLRun uses the same cloud storage as KFP remote sync." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (not .Values.seaweedfs.allInOne.enabled) }}
{{ fail "seaweedfs.remote requires seaweedfs.allInOne.enabled=true." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (kindIs "bool" .Values.seaweedfs.remote.mount.mountExisting) (not .Values.seaweedfs.remote.mount.mountExisting) }}
{{ fail "seaweedfs.remote always runs remote.mount into the filer; seaweedfs.remote.mount.mountExisting=false is not supported (remove the value or set true)." }}
{{- end }}
{{- $remoteCloudBucket := include "mlrun-ce.seaweedfs.remote.remoteBucket" . -}}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (not $remoteCloudBucket) }}
{{ fail "seaweedfs.remote.bucket (cloud target for KFP sync) is required when seaweedfs.remote.enabled is true; defaults to storage.s3.bucket or storage.azure.containerName (same as MLRun)." }}
{{- end }}
{{- $mlrunCloudBucket := include "mlrun-ce.storage.mlrunCloudBucket" . -}}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (not $mlrunCloudBucket) }}
{{ fail "seaweedfs.remote requires storage.mode \"s3\" or \"azure-blob\" with storage.s3.bucket or storage.azure.containerName set." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (ne $remoteCloudBucket $mlrunCloudBucket) }}
{{ fail (printf "seaweedfs.remote.bucket (%q) must match MLRun cloud storage (%q). Use one shared S3 bucket or Azure container for MLRun and KFP artifacts; omit seaweedfs.remote.bucket to default from storage.s3.bucket or storage.azure.containerName." $remoteCloudBucket $mlrunCloudBucket) }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (eq .Values.seaweedfs.remote.provider "s3") (not (eq .Values.storage.mode "s3")) }}
{{ fail "seaweedfs.remote.provider \"s3\" requires storage.mode \"s3\"." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (eq .Values.seaweedfs.remote.provider "azure") (not (eq .Values.storage.mode "azure-blob")) }}
{{ fail "seaweedfs.remote.provider \"azure\" requires storage.mode \"azure-blob\"." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (not (regexMatch "^[a-zA-Z0-9]+$" (.Values.seaweedfs.remote.name | default ""))) }}
{{ fail "seaweedfs.remote.name must contain only letters and numbers (SeaweedFS remote.configure rejects hyphens and other characters)." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (eq .Values.seaweedfs.remote.provider "s3") (not .Values.seaweedfs.remote.s3.endpoint) }}
{{ fail "seaweedfs.remote.s3.endpoint is required when seaweedfs.remote.provider is \"s3\" (e.g. s3.us-east-2.amazonaws.com)." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (eq .Values.seaweedfs.remote.provider "s3") .Values.global.infrastructure.aws.s3NonAnonymous }}
{{ fail "seaweedfs.remote with provider \"s3\" requires static storage.s3.accessKey and storage.s3.secretKey; global.infrastructure.aws.s3NonAnonymous (IAM/IRSA) is not supported for the SeaweedFS remote gateway." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (eq .Values.seaweedfs.remote.provider "s3") (not .Values.global.infrastructure.aws.s3NonAnonymous) (not .Values.storage.s3.accessKey) }}
{{ fail "seaweedfs.remote with provider \"s3\" requires storage.s3.accessKey (gateway credentials for KFP cloud sync)." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (eq .Values.seaweedfs.remote.provider "s3") (not .Values.global.infrastructure.aws.s3NonAnonymous) (not .Values.storage.s3.secretKey) }}
{{ fail "seaweedfs.remote with provider \"s3\" requires storage.s3.secretKey (gateway credentials for KFP cloud sync)." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (eq .Values.seaweedfs.remote.provider "azure") (not (or .Values.storage.azure.connectionString (and .Values.storage.azure.accountName .Values.storage.azure.accountKey))) }}
{{ fail "seaweedfs.remote with provider \"azure\" requires storage.azure.connectionString or storage.azure.accountName+accountKey." }}
{{- end }}
{{- if and (eq (include "mlrun-ce.seaweedfs.remote.enabled" .) "true") (not (has .Values.seaweedfs.remote.provider (list "s3" "azure"))) }}
{{ fail "seaweedfs.remote.provider must be \"s3\" or \"azure\" when seaweedfs.remote.enabled is true." }}
{{- end }}
