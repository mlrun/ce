{{- if and (not .Values.global.infrastructure.aws.s3NonAnonymous) (not .Values.global.s3CredentialsSecretName) }}
# S3 credentials secret for MLRun, Jupyter, and other components
# Uses AWS SDK standard environment variable names
# Only created if global.s3CredentialsSecretName is not provided (user brings their own secret)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mlrun-ce.s3.credentials.secret.name" . }}
  labels:
    {{- include "mlrun-ce.common.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ include "mlrun-ce.s3.accessKey" . }}
  AWS_SECRET_ACCESS_KEY: {{ include "mlrun-ce.s3.secretKey" . }}
  AWS_ENDPOINT_URL_S3: {{ include "mlrun-ce.s3.service.url" . }}
{{- end }}
