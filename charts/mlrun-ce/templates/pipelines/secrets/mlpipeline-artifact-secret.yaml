{{- if and .Values.pipelines.enabled (eq (include "mlrun-ce.pipelines.usesStaticCredentials" . | toString) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: mlpipeline-seaweedfs-artifact
  labels:
    application-crd-id: kubeflow-pipelines
    {{- include "mlrun-ce.pipelines.labels" . | nindent 4 }}
type: Opaque
stringData:
  accesskey: {{ include "mlrun-ce.pipelines.s3.accessKey" . | quote }}
  secretkey: {{ include "mlrun-ce.pipelines.s3.secretKey" . | quote }}
{{- end }}
