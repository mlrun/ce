{{- if .Values.pipelines.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: kfp-launcher
data:
  # Default pipeline root for artifact storage (in-cluster SeaweedFS).
  # External AWS/Azure persistence is handled by seaweedfs.remote gateway sync.
  # See: https://www.kubeflow.org/docs/components/pipelines/operator-guides/configure-object-store/
  defaultPipelineRoot: {{ include "mlrun-ce.pipelines.defaultPipelineRoot" . | quote }}
{{- end -}}
