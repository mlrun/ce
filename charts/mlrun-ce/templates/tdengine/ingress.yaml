{{- if and .Values.tdengine.enabled .Values.tdengine.ingress.enabled -}}
{{- $hosts := (default (list) .Values.tdengine.ingress.hosts) }}
{{- if eq (len $hosts) 0 }}
{{- fail "tdengine.ingress.hosts must be explicitly set when tdengine.ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mlrun-ce.tdengine.fullname" . }}
  labels:
    {{- include "mlrun-ce.tdengine.labels" . | nindent 4 }}
  {{- with .Values.tdengine.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.tdengine.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- $root := . }}
  rules:
  {{- range $hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "mlrun-ce.tdengine.fullname" $root }}
            port:
              number: {{ default 6041 (index $root.Values.tdengine.service "restPort") }}
  {{- end }}
{{- end }}


