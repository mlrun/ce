{{- if and .Values.tdengine.enabled .Values.tdengine.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mlrun-ce.tdengine.fullname" . }}
  labels:
    {{- include "mlrun-ce.tdengine.labels" . | nindent 4 }}
  {{- with .Values.tdengine.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.tdengine.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  {{- $root := . }}
  {{- range .Values.tdengine.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "mlrun-ce.tdengine.fullname" $root }}
            port:
              number: 6041
  {{- end }}
{{- end }}


